name: Build Android APK

on:
  workflow_dispatch:  # Позволяет запускать сборку вручную
  push:
    branches: [ main ] # Запускает сборку при пуше в ветку main

jobs:
  build:
    runs-on: ubuntu-latest # Использует виртуальную машину с Ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Используем JDK от Eclipse Temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2P-Empire-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk